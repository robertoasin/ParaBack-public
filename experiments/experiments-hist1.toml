# Experimento largo, Ronda 1 (tools/pbhist/README.md): los backbones de las instancias de todas las
# PB Competitions, en el cluster de Chile (mirador). Formato: paraback/experiments.py. Comprobar:
#   python -m paraback --config tools/cluster/experiments-hist1.toml
#
# Una sola configuración, Mix-3+MF del artículo (ev3-mf: RB-PG, NapBack y GuroBack con strided:i/3, y
# GuroBack-mf), sin x* dada: cada ejecución busca primero z* y x* y las guarda (solution.out). Ronda de
# criba: 300 s por instancia, de menor a mayor. Las que agoten el límite irán a una Ronda 2 más larga.
#
# Nodos de mirador: 8 CPU y RealMemory 30 000 MB, pero un nodo ocioso sólo tiene 27 565 MB libres
# (2026-11-02). Caben 4 trabajadores de 2 CPU y 6 500 MB (26 000 MB por trabajo) si el orquestador
# comparte sus CPUs (orchestrator_slot = false: está ocioso el 99 % del tiempo); los dos GuroBack con
# 2 hilos. --memory-limit queda en el 90 % de cada hueco (5 850 MB). Protocolo por bits como en la
# evaluación: Gurobi hasta 32 bits, ScipBack-exacto de 33 a 66, RB-PG por encima; NapBack se sustituye
# en el sitio por RB-PG si Naps no traduce.
#
# Gurobi: servidor de tokens (~/gurobi.lic con TOKENSERVER=), 2 tokens por ejecución, como mucho 22 a
# la vez con los 11 nodos.
#
# Slurm (2026-11-02): MaxArraySize 1001 y MaxJobCount 10 000, así que arrays de 1 000 tareas y tandas de
# como mucho 5 000 (submit_experiments.py --tasks; lo comprueba con scontrol y squeue antes de enviar).
# Partición fondecyt1261266 (MaxTime 1 día, los 15 nodos, más prioridad que judging): la ronda usa 11.
# mirador-node15 queda para los concursos, y 13 y 14 fuera porque no responden (2026-11-02: en la prueba
# de humo tardaron 6,5 min en arrancar y después se colgaron; pendiente del administrador). Y 02 fuera
# porque está averiado (Ronda 1, 2026-11-09: el 20,7 % de sus ejecuciones perdidas o fallidas, frente al
# 0,0–0,2 % del resto; segfaults y bad_alloc en instancias diminutas). --time = 5 + 5 = 10 min: cabe también en judging.
#
# Instancias: las de unicas/ (tools/pbhist/consolidar.py; ~/PBO/historico/unicas-2026-11-02.tar), sin
# las 192 de más de 100 MB, que con 6,5 GB por trabajador no caben (al final de ronda1.txt, que va de
# menor a mayor). Desde el directorio unicas/:
#   head -n 28400 ronda1.txt | sed "s|^|$PWD/instancias/|" > ~/ronda1-rutas.txt
#
# Piloto (CLAUDE.md §6: en mirador nunca se ha ejecutado nada): las 14 de hist1-piloto.txt (10 OPT
# con tiempo conocido de ev3-mf, entre ellas una de 53 bits y otra de 361, y 4 DEC):
#   sed "s|^|$PWD/instancias/|" ~/paraback/tools/cluster/hist1-piloto.txt > ~/piloto-rutas.txt
#   python tools/cluster/submit_experiments.py tools/cluster/experiments-hist1.toml \
#       -l ~/piloto-rutas.txt -o ~/runs/hist1-piloto
#
# Ronda:
#   python tools/cluster/submit_experiments.py tools/cluster/experiments-hist1.toml \
#       -l ~/ronda1-rutas.txt -o ~/runs/hist1 --dry-run
#   python tools/cluster/submit_experiments.py tools/cluster/experiments-hist1.toml \
#       -l ~/ronda1-rutas.txt -o ~/runs/hist1 [--tasks A-B]
# Resumen (compare.tsv, summary.tsv, failures.txt), a mitad de ronda justo antes de la tanda siguiente:
#   sbatch tools/cluster/collect_mirador.sbatch ~/runs/hist1

[defaults]
time_limit = 300
repeats = 1
options = ["--threads-per-worker", "2", "--float-max-bits", "32", "--float-fallback", "scip-exact",
           "--substitute", "roundingsat:pguide=1"]

[cluster]
partition = "fondecyt1261266"    # la del proyecto (MaxTime 1 día); también cabe en judging (MaxTime 10 min)
account = ""
cores_per_node = 8
mem_per_node = "30000M"
cores_per_worker = 2
mem_per_worker = "6500M"
orchestrator_slot = false
max_array_size = 1000
gurobi_license = "server"
max_concurrent = 0
exclude = "mirador-node[02,13-15]"  # 15 para judging; 13 y 14 no responden; 02 averiado
exclusive = false
extra_minutes = 5
launcher = "mpirun"
env = "~/paraback-env"
traces = false                   # 28 000 ejecuciones: las trazas ocuparían demasiado

[[experiment]]
name = "h1-mf"
description = "Mix-3+MF (ev3-mf) en mirador: 4 trabajadores de 2 CPU y 6,5 GB, sin x* dada, 300 s"
workers = ["roundingsat:pguide=1,order=strided:0/3", "cadiback:order=strided:1/3", "gurobi:order=strided:2/3",
           "gurobi:chunks=maxflip:5"]
